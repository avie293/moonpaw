modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/avie293/avie-issues/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
description = '''${mod_description}'''
authors = "${mod_author}"
displayURL = "https://avie.cc/"
iconFile = "assets/${mod_id}/icon.png"

[[mixins]]
config = "moonpaw.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},26.4)"
ordering = "NONE"
side = "BOTH"
