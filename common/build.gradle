plugins {
	id 'multiloader-common'
	id 'net.neoforged.moddev'
}

// Vanilla Minecraft only, no loader: the loader specific code is in fabric and neoforge
neoForge {
	neoFormVersion = neo_form_version
	addModdingDependenciesTo(sourceSets.test)
}

dependencies {
	compileOnly "net.fabricmc:sponge-mixin:${mixin_version}"
	compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

// The loader projects compile these sources and resources into their jars
configurations {
	commonJava {
		canBeResolved = false
		canBeConsumed = true
	}
	commonResources {
		canBeResolved = false
		canBeConsumed = true
	}
}

artifacts {
	commonJava sourceSets.main.java.sourceDirectories.singleFile
	commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
